trigger: none

resources:
  pipelines:
  - pipeline: ci
    source: CI Build
    trigger:
      branches:
        include:
          - main

pool:
  name: Default

variables:
  dockerHubRepo: prasidsash/employeeprofileapp

stages:

# ======================================================
# INSTALL NGINX INGRESS CONTROLLER
# ======================================================

- stage: Install_Ingress
  displayName: Install NGINX Ingress Controller

  jobs:
  - job: InstallIngress
    displayName: Install NGINX Ingress

    steps:

    - checkout: self

    - powershell: |

        Write-Host "========== INSTALL NGINX INGRESS =========="

        helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
        helm repo update

        helm upgrade --install ingress-nginx `
          ingress-nginx/ingress-nginx `
          --namespace ingress-nginx `
          --create-namespace `
          --wait

        kubectl get pods -n ingress-nginx

      displayName: Install NGINX Ingress

# ======================================================
# DEV DEPLOYMENT
# ======================================================

- stage: Deploy_DEV
  displayName: Deploy to DEV
  dependsOn: Install_Ingress

  jobs:
  - deployment: DeployDev
    displayName: Helm Deploy DEV
    environment: dev

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - download: ci
            artifact: imageTag

          - powershell: |

              Write-Host "========== DEV DEPLOYMENT =========="

              $tag = Get-Content "$(Pipeline.Workspace)/ci/imageTag/imageTag.txt"
              Write-Host "Image Tag: $tag"

              kubectl config current-context
              kubectl get nodes

              $namespace="employeeprofileapp-dev"

              helm upgrade --install employeeprofileapp `
                ./helm/app-chart `
                --namespace $namespace `
                --create-namespace `
                -f ./helm/app-chart/values-dev.yaml `
                --set image.repository=$(dockerHubRepo) `
                --set image.tag=$tag

              kubectl rollout status deployment/employeeprofileapp-employeeprofileapp -n $namespace
              kubectl get pods -n $namespace
              kubectl get svc -n $namespace
              kubectl get ingress -n $namespace

# ======================================================
# QA DEPLOYMENT
# ======================================================

- stage: Deploy_QA
  displayName: Deploy to QA
  dependsOn: Deploy_DEV

  jobs:
  - deployment: DeployQA
    displayName: Helm Deploy QA
    environment: qa

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - download: ci
            artifact: imageTag

          - powershell: |

              Write-Host "========== QA DEPLOYMENT =========="

              $tag = Get-Content "$(Pipeline.Workspace)/ci/imageTag/imageTag.txt"
              Write-Host "Image Tag: $tag"

              $namespace="employeeprofileapp-qa"

              helm upgrade --install employeeprofileapp `
                ./helm/app-chart `
                --namespace $namespace `
                --create-namespace `
                -f ./helm/app-chart/values-qa.yaml `
                --set image.repository=$(dockerHubRepo) `
                --set image.tag=$tag

              kubectl rollout status deployment/employeeprofileapp-employeeprofileapp -n $namespace
              kubectl get pods -n $namespace

# ======================================================
# UAT DEPLOYMENT
# ======================================================

- stage: Deploy_UAT
  displayName: Deploy to UAT
  dependsOn: Deploy_QA

  jobs:
  - deployment: DeployUAT
    displayName: Helm Deploy UAT
    environment: uat

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - download: ci
            artifact: imageTag

          - powershell: |

              Write-Host "========== UAT DEPLOYMENT =========="

              $tag = Get-Content "$(Pipeline.Workspace)/ci/imageTag/imageTag.txt"
              Write-Host "Image Tag: $tag"

              $namespace="employeeprofileapp-uat"

              helm upgrade --install employeeprofileapp `
                ./helm/app-chart `
                --namespace $namespace `
                --create-namespace `
                -f ./helm/app-chart/values-uat.yaml `
                --set image.repository=$(dockerHubRepo) `
                --set image.tag=$tag

              kubectl rollout status deployment/employeeprofileapp-employeeprofileapp -n $namespace
              kubectl get pods -n $namespace

# ======================================================
# PROD DEPLOYMENT
# ======================================================

- stage: Deploy_PROD
  displayName: Deploy to PROD
  dependsOn: Deploy_UAT

  jobs:
  - deployment: DeployProd
    displayName: Helm Deploy PROD
    environment: prod

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - download: ci
            artifact: imageTag

          - powershell: |

              Write-Host "========== PROD DEPLOYMENT =========="

              $tag = Get-Content "$(Pipeline.Workspace)/ci/imageTag/imageTag.txt"
              Write-Host "Image Tag: $tag"

              $namespace="employeeprofileapp-prod"

              helm upgrade --install employeeprofileapp `
                ./helm/app-chart `
                --namespace $namespace `
                --create-namespace `
                -f ./helm/app-chart/values-prod.yaml `
                --set image.repository=$(dockerHubRepo) `
                --set image.tag=$tag

              kubectl rollout status deployment/employeeprofileapp-employeeprofileapp -n $namespace
              kubectl get pods -n $namespace