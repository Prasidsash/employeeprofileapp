---
# Source: employeeprofileapp/templates/service.yaml
apiVersion: v1
kind: Service

metadata:
  name: employeeprofileapp-employeeprofileapp
  labels:
    app.kubernetes.io/name: employeeprofileapp
    app.kubernetes.io/instance: employeeprofileapp

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: employeeprofileapp
    app.kubernetes.io/instance: employeeprofileapp

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
# Source: employeeprofileapp/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: employeeprofileapp-employeeprofileapp
  labels:
    app.kubernetes.io/name: employeeprofileapp
    app.kubernetes.io/instance: employeeprofileapp

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: employeeprofileapp
      app.kubernetes.io/instance: employeeprofileapp

  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-06-13 15:15:16.7571014 +0530 IST m=+0.124280801"
      labels:
        app.kubernetes.io/name: employeeprofileapp
        app.kubernetes.io/instance: employeeprofileapp

    spec:
      serviceAccountName: employee-sa

      containers:
        - name: employeeprofileapp

          image: "prasidsash/employeeprofileapp:latest"
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          ports:
            - containerPort: 8080

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: employee-db-secret
                  key: DB_PASSWORD

            - name: ASPNETCORE_ENVIRONMENT
              value: "dev"

            - name: APP_ENV
              value: "dev"

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
---
# Source: employeeprofileapp/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employeeprofileapp-employeeprofileapp-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: employeeprofileapp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: employeeprofileapp-employeeprofileapp
                port:
                  number: 80
