apiVersion: v1
kind: Service

metadata:
  name: {{ include "employeeprofileapp.fullname" . }}
  labels:
    {{- include "employeeprofileapp.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "employeeprofileapp.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      {{- if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}